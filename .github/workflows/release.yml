name: Release

# Tag a commit `vX.Y.Z` and this builds the DMG and attaches it to a GitHub
# Release. Without signing secrets the DMG is ad hoc signed (users right click
# then Open once). Add the three secrets below and it is Developer ID signed,
# notarized and stapled.
#
#   MACOS_CERT_P12_BASE64   base64 of a Developer ID Application .p12
#   MACOS_CERT_PASSWORD     its password
#   MACOS_TEAM_ID           the Apple team id
#   NOTARY_APPLE_ID         Apple ID for notarytool
#   NOTARY_APP_PASSWORD     an app specific password for that Apple ID

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    name: Build DMG
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers

      - name: Import signing certificate
        if: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
        env:
          P12_B64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)"
          echo "HOLMES_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "HOLMES_TEAM_ID=${{ secrets.MACOS_TEAM_ID }}" >> "$GITHUB_ENV"

      - name: Store notarization credentials
        if: ${{ secrets.NOTARY_APPLE_ID != '' && secrets.MACOS_CERT_P12_BASE64 != '' }}
        run: |
          xcrun notarytool store-credentials holmes-notary \
            --apple-id "${{ secrets.NOTARY_APPLE_ID }}" \
            --team-id "${{ secrets.MACOS_TEAM_ID }}" \
            --password "${{ secrets.NOTARY_APP_PASSWORD }}"
          echo "HOLMES_NOTARY_PROFILE=holmes-notary" >> "$GITHUB_ENV"

      - name: Build DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] && export HOLMES_VERSION="$VERSION"
          bash holmes/scripts/release/build-dmg.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Holmes-dmg
          path: |
            dist/*.dmg
            dist/*.sha256
          retention-days: 30

      - name: Attach to GitHub Release
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.sha256
          generate_release_notes: true
          draft: true
