name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Holmes Local is a plain Xcode project (no Package.swift). CI builds it exactly
# the way the README tells contributors to: ad-hoc signed, no team, Debug.
# Ollama is not needed to compile; nothing here talks to a model.

jobs:
  build:
    name: Build holmes.app
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: DerivedData
          key: ${{ runner.os }}-holmes-deriveddata-${{ hashFiles('holmes/holmes.xcodeproj/project.pbxproj', 'holmes/holmes/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-holmes-deriveddata-

      - name: Build (Debug, ad-hoc signed)
        working-directory: holmes
        run: |
          set -o pipefail
          xcodebuild -project holmes.xcodeproj \
                     -scheme holmes \
                     -configuration Debug \
                     -derivedDataPath ../DerivedData \
                     build \
                     CODE_SIGN_IDENTITY=- \
                     CODE_SIGN_STYLE=Manual \
                     DEVELOPMENT_TEAM= \
            | tee ../xcodebuild.log \
            | grep -E 'error:|warning:|BUILD (SUCCEEDED|FAILED)' || true
          grep -q 'BUILD SUCCEEDED' ../xcodebuild.log

      - name: Test guided demo behavior
        run: holmes/tests/run-guided-demo-tests.sh

      - name: Test email drafting, voice routing and work lifecycle
        run: |
          holmes/tests/run-action-run-evidence-tests.sh
          holmes/tests/run-email-compose-tests.sh
          holmes/tests/run-browser-compose-bridge-tests.sh
          holmes/tests/run-email-draft-intent-tests.sh
          holmes/tests/run-email-drafting-tests.sh
          holmes/tests/run-email-draft-coordinator-tests.sh
          holmes/tests/run-email-prediction-tests.sh
          holmes/tests/run-mail-compose-matcher-tests.sh
          holmes/tests/run-request-routing-tests.sh
          holmes/tests/run-voice-hold-tests.sh
          holmes/tests/run-work-activity-tests.sh
          holmes/tests/run-extension-installer-tests.sh

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 7

      - name: Upload holmes.app (Debug)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: holmes-Debug
          path: DerivedData/Build/Products/Debug/holmes.app
          retention-days: 7

  lint:
    name: SwiftLint (advisory)
    runs-on: macos-15
    # Report style violations as warnings; installation and execution failures
    # still fail this job so a broken lint setup cannot silently pass.

    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --config .swiftlint.yml --reporter github-actions-logging --lenient
