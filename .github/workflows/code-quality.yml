name: Code Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cheap, advisory checks. The real gate is the build in build.yml.

jobs:
  secrets-scan:
    name: No credentials in source
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Scan for committed keys
        run: |
          echo "Checking for hardcoded credentials..."
          # Holmes Local has no model API key. The only credentials that could
          # ever appear are an ElevenLabs key or a Composio key, and both belong
          # in ~/.holmes, never in the repo.
          if grep -rEn "(sk_[A-Za-z0-9]{20,}|xi-api-key: *['\"][A-Za-z0-9]{10,}|ck_[A-Za-z0-9]{20,})" \
               --include='*.swift' --include='*.json' --include='*.md' --include='*.sh' --include='*.js' \
               holmes/ README.md 2>/dev/null | grep -v 'YOUR_'; then
            echo "ERROR: something that looks like a real credential is committed"
            exit 1
          fi
          echo "No credentials detected"

  docs-check:
    name: Required files present
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check README, LICENSE, notices
        run: |
          for f in README.md LICENSE THIRD_PARTY_NOTICES.md CONTRIBUTING.md holmes/MCP-SETUP.md; do
            if [ ! -f "$f" ]; then echo "ERROR: $f not found"; exit 1; fi
          done
          echo "Documentation check passed"

  complexity:
    name: Complexity report (advisory)
    runs-on: macos-15
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Lizard
        run: brew install lizard

      - name: Run Lizard
        run: lizard holmes/holmes -l swift --CCN 15 -w || true
